<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRM Lead Generation Form</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Meta tracking values for test -->
    <meta name="description" content="A demonstration form to test the src_tracking logic.">
    <script
src='//in.fw-cdn.com/31719983/876676.js'
chat='true'>
</script>
</head>
<body>
    <div class="form-container">
        <div class="form-header">
            <h1>Get in Touch</h1>
            <p>Our team will reach out to you shortly.</p>
        </div>
        <form id="crmForm" action="#" method="POST">
            <!-- Visible Fields -->
            <div class="input-group">
                <label for="full_name">Full Name</label>
                <input type="text" id="full_name" name="full_name" required placeholder="John Doe" autocomplete="off">
            </div>
            <div class="input-group">
                <label for="email">Work Email</label>
                <input type="email" id="email" name="email" required placeholder="john@company.com" autocomplete="off">
            </div>
            
            <!-- Hidden Tracking Fields (These will be populated by src_tracking.js) -->
            <!-- The script checks input name or id for these keywords -->
            <input type="hidden" id="lead_source" name="lead_source" value="">
            <input type="hidden" id="lead_medium" name="lead_medium" value="">
            <input type="hidden" id="lead_campaign" name="lead_campaign" value="">
            <input type="hidden" id="google_click_id" name="google_click_id" value="">
            <input type="hidden" id="facebook_click_id" name="facebook_click_id" value="">
            <input type="hidden" id="ga_client_id" name="ga_client_id" value="">

            <button type="submit" class="submit-btn" id="submitBtn">Submit Request</button>
        </form>
        <div class="tracking-debug" id="debugInfo">
            <h3>Tracking Info Details (For Validation)</h3>
            <pre id="debugOutput">Loading tracking data...</pre>
        </div>
    </div>

    <!-- Include the tracking script we modified -->
    <script src="src_tracking.js"></script>
    
    <script>
        // Script to display the populated values for debugging
        window.addEventListener("load", function() {
            setTimeout(() => {
                const ls = document.getElementById("lead_source").value;
                const lm = document.getElementById("lead_medium").value;
                const lc = document.getElementById("lead_campaign").value;
                
                document.getElementById("debugOutput").textContent = 
                    `Source: ${ls || 'N/A'}\nMedium: ${lm || 'N/A'}\nCampaign: ${lc || 'N/A'}\n\nHint: Open this page with ?utm_source=FB in the URL!`;
            }, 300); // slight delay to let tracking script run
        });

        document.getElementById('crmForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const originalText = btn.textContent;
            
            // Micro animation
            btn.textContent = "Submitting...";
            btn.style.opacity = 0.8;
            
            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData.entries());
            
            console.log("Form Submission Data:");
            console.table(data);

            setTimeout(() => {
                alert("Successfully saved! Check your developer console to see the full submitted payload including tracking params.");
                btn.textContent = originalText;
                btn.style.opacity = 1;
            }, 500);
        });
    </script>
</body>
</html>
